services:
  - type: web
    name: datags-orders
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DON_NHIEU_SAN_PHAM_ENABLED
        value: "true"
      - key: TAO_DON_NHIEU_SAN_PHAM_ENABLED
        value: "true"
      - key: UNC_NHIEU_SAN_PHAM_ENABLED
        value: "true"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: DATAGS
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: GS-DONHANG
      - key: GOOGLE_SHEET_DONHANG_NAME
        value: DONHANG
      - key: GOOGLE_SHEET_SYNC_ENABLED
        value: "true"
      - key: GOOGLE_SHEET_SYNC_DIRECTION
        value: sheet-to-mongo
      - key: GOOGLE_SHEET_SYNC_ALLOW_DELETES
        value: "false"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
