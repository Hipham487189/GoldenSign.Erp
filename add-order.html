<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thêm Đơn Hàng Mới - DATAGS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <script src="public/js/theme.js"></script>
  <link rel="stylesheet" href="public/css/components.css">
  <style>
*, *::before, *::after {
  box-sizing: border-box;
  padding: 0;
  margin: 0;
}

:root {
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --primary: #0284c7;
  --primary-hover: #0369a1;
  --primary-2: #06b6d4;
  --primary-gradient: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
  --success-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
  --danger-gradient: linear-gradient(135deg, #e11d48 0%, #f43f5e 100%);
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;
  --page-gutter: clamp(1rem, 2.4vw, 2rem);
}

body:not(.light-mode) {
  --bg-main: #070e1a;
  --bg-gradient: radial-gradient(circle at 18% -8%, rgba(14, 165, 233, 0.16), transparent 38%),
                 radial-gradient(circle at 88% 95%, rgba(6, 182, 212, 0.11), transparent 34%),
                 #070e1a;
  --bg-card: rgba(13, 22, 38, 0.72);
  --bg-card-solid: #0c1729;
  --border-color: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --input-bg: rgba(9, 16, 29, 0.72);
  --input-border: rgba(255, 255, 255, 0.10);
  --input-focus: #38bdf8;
  --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.38);
}

body.light-mode {
  --bg-main: #c9dde0;
  --bg-gradient: radial-gradient(circle at 18% -8%, rgba(20, 184, 166, 0.16), transparent 38%),
                 radial-gradient(circle at 88% 95%, rgba(2, 132, 199, 0.13), transparent 34%),
                 #c9dde0;
  --bg-card: rgba(238, 248, 250, 0.94);
  --bg-card-solid: #eef8fa;
  --border-color: rgba(15, 91, 105, 0.14);
  --border-strong: rgba(15, 91, 105, 0.24);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  --input-bg: #f7fcfd;
  --input-border: rgba(15, 91, 105, 0.16);
  --input-focus: #0284c7;
  --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.08);
}

html {
  height: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  flex-direction: column;
  background: var(--bg-gradient);
  color: var(--text-main);
  height: 100vh;
  overflow: hidden;
  font-family: var(--font-sans);
  letter-spacing: -0.01em;
}

a, button, input, select, textarea {
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

/* TOP HEADER */
.page-header {
  background: var(--bg-card-solid);
  border-bottom: 1px solid var(--border-color);
  padding: 1.2rem 1.8rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-sm);
}

.page-header-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.page-header-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.page-header-title i {
  font-size: 1.8rem;
  color: var(--primary);
  filter: drop-shadow(0 0 8px rgba(2, 132, 199, 0.3));
}

.page-header-subtitle {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.page-header-actions {
  display: flex;
  gap: 0.8rem;
  align-items: center;
}

/* MAIN CONTENT */
.page-container {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem var(--page-gutter);
  display: flex;
  justify-content: center;
}

.form-wrapper {
  width: 100%;
  max-width: 1600px;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.order-top-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
  gap: 1.25rem;
}

.order-bottom-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25rem;
  align-items: stretch;
}

/* SECTION CARD */
.section-card {
  background: var(--bg-card-solid);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1.4rem;
  box-shadow: var(--shadow-sm);
  animation: slideUp 0.4s ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.section-card-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1.3rem;
  padding-bottom: 0.8rem;
  border-bottom: 2px solid var(--border-color);
}

.section-card-title i {
  font-size: 1.3rem;
  color: var(--primary);
}

/* FORM GRID */
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.2rem;
}

.form-grid.full {
  grid-template-columns: 1fr;
}

.form-grid.two-col {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.form-grid.order-attachments-grid {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.9rem;
}

.order-attachments-grid .form-group {
  min-width: 0;
  gap: 0.45rem;
}

.order-attachments-grid .form-label {
  min-height: 2.5em;
  margin: 0;
  font-size: 0.82rem;
}

.order-attachments-grid .file-upload-row {
  gap: 0.4rem;
}

.order-attachments-grid .file-upload-button {
  max-width: 100%;
  padding-inline: 0.65rem;
  font-size: 0.78rem;
}

.order-detail-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.customer-detail-grid {
  grid-template-columns: repeat(6, minmax(0, 1fr));
  row-gap: 1.5rem;
}

.customer-detail-grid .mst-field {
  grid-column: span 2;
}

.customer-detail-grid .company-field {
  grid-column: span 4;
}

.customer-detail-grid .address-field {
  grid-column: 1 / -1;
}

.customer-detail-divider {
  grid-column: 1 / -1;
  height: 2px;
  border-radius: var(--radius-full);
  background: var(--primary);
}

.customer-detail-grid .contact-field {
  grid-column: span 3;
}

.mst-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.mst-label-row .form-label {
  margin: 0;
}

.mst-label-row #mstLoading {
  margin: 0 !important;
  text-align: right;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.form-label {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-main);
}

.form-input,
.form-select {
  padding: 0.75rem 0.95rem;
  border: 1px solid var(--input-border);
  border-radius: var(--radius-md);
  background: var(--input-bg);
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.file-upload-row {
  display: flex;
  flex-wrap: wrap;
  min-width: 0;
  align-items: flex-start;
  gap: 0.4rem 0.75rem;
}

.file-upload-button {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  min-height: 2.6rem;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.6rem 0.9rem;
  overflow: hidden;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: var(--bg-card-solid);
  color: var(--primary);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}

.file-upload-button:hover {
  border-color: var(--primary);
  background: rgba(2, 132, 199, 0.08);
}

.file-upload-button:focus-within {
  outline: 3px solid rgba(2, 132, 199, 0.2);
  outline-offset: 2px;
}

.file-upload-button input[type="file"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.file-upload-name {
  flex: 0 0 100%;
  color: var(--text-main);
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.order-attachments-grid .form-group > span:last-child {
  font-size: 0.72rem !important;
  white-space: normal;
}

.form-input:focus,
.form-select:focus {
  border-color: var(--input-focus);
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
}

#new_tinhTrang.status-soan-ho-so {
  color: #704214;
  font-weight: 700;
}

#new_tinhTrang {
  transition: border-color 0.18s, box-shadow 0.18s;
}

body:not(.light-mode) #new_tinhTrang.status-soan-ho-so {
  color: #f1c99b;
}

.form-input:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.form-status {
  min-height: 1.1rem;
  color: var(--text-muted);
  font-size: 0.8rem;
}

.form-status:empty {
  display: none;
}

.form-status.error {
  color: #f43f5e;
}

.form-status.success {
  color: #10b981;
}

.form-notice-dialog {
  width: min(440px, calc(100vw - 2rem));
  margin: auto;
  padding: 0;
  overflow: hidden;
  color: var(--text-main);
  background: var(--bg-card-solid);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.form-notice-dialog::backdrop {
  background: rgba(3, 10, 20, 0.58);
  backdrop-filter: blur(4px);
}

.form-notice-content {
  display: flex;
  align-items: flex-start;
  gap: 0.9rem;
  padding: 1.4rem 1.5rem;
}

.form-notice-icon {
  display: grid;
  flex: 0 0 2.5rem;
  width: 2.5rem;
  height: 2.5rem;
  place-items: center;
  color: #0284c7;
  background: rgba(2, 132, 199, 0.12);
  border-radius: 50%;
}

.form-notice-dialog[data-type="error"] .form-notice-icon {
  color: #e11d48;
  background: rgba(225, 29, 72, 0.12);
}

.form-notice-dialog[data-type="success"] .form-notice-icon {
  color: #059669;
  background: rgba(5, 150, 105, 0.12);
}

.form-notice-copy {
  min-width: 0;
}

.form-notice-copy h2 {
  margin: 0.1rem 0 0.35rem;
  font-size: 1rem;
  font-weight: 750;
}

.form-notice-copy p {
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.55;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.form-notice-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.65rem;
  padding: 0.9rem 1.5rem;
  background: var(--bg-card-solid);
  border-top: 1px solid var(--border-color);
}

.form-notice-actions .btn {
  min-width: 6rem;
  justify-content: center;
}

.select-pager {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.6rem;
  margin-top: 0.5rem;
}

.select-pager[hidden] {
  display: none;
}

.select-pager button {
  padding: 0.35rem 0.6rem;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  background: var(--bg-card-solid);
  color: var(--text-main);
  cursor: pointer;
}

.select-pager button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.select-pager span {
  color: var(--text-muted);
  font-size: 0.8rem;
}

/* BUTTONS */
.btn {
  padding: 0.75rem 1.2rem;
  border: none;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  white-space: nowrap;
  transition: all 0.18s ease;
}

.btn-primary {
  background: var(--primary-gradient);
  color: white;
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--primary-hover) 0%, #0284c7 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text-main);
  border-color: var(--border-strong);
}

.btn-danger {
  background: rgba(244, 63, 94, 0.15);
  color: #f43f5e;
}

.btn-danger:hover {
  background: rgba(244, 63, 94, 0.25);
}

/* STICKY FOOTER */
.form-footer {
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
  align-items: center;
  position: sticky;
  bottom: 0;
  background: var(--bg-gradient);
  padding: 1.25rem max(var(--page-gutter), calc((100% - 1600px) / 2));
  border-top: 1px solid var(--border-color);
  width: 100%;
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.22);
  border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(56, 189, 248, 0.45);
}

@media (max-width: 1024px) {
  .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .customer-detail-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}

@media (max-width: 1100px) {
  .form-grid.order-attachments-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 768px) {
  .order-top-grid,
  .order-bottom-grid,
  .form-grid,
  .form-grid.two-col { grid-template-columns: 1fr; }
  .customer-detail-grid .mst-field,
  .customer-detail-grid .company-field,
  .customer-detail-grid .address-field { grid-column: auto; }
  .customer-detail-grid .contact-field { grid-column: auto; }
  .section-card { padding: 1.1rem; }
  .form-footer { padding-block: 1rem; }
  .page-header { flex-wrap: wrap; }
  .page-header-actions { width: 100%; margin-top: 1rem; }
  .form-notice-content { padding: 1.2rem; }
  .form-notice-actions { padding: 0.8rem 1.2rem; }
}
  </style>
</head>
<body>
  <!-- TOP HEADER -->
  <div class="page-header">
    <div class="page-header-left">
      <h1 class="page-header-title">
        <i class="fa-solid fa-cart-plus"></i>
        <div>
          <div>Thêm Đơn Hàng Mới</div>
          <div class="page-header-subtitle">Nhập thông tin và tạo đơn hàng</div>
        </div>
      </h1>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-secondary" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> Quay Lại
      </button>
    </div>
  </div>

  <!-- MAIN FORM CONTAINER -->
  <div class="page-container">
    <div class="form-wrapper">
      <div id="formLoadStatus" class="form-status" role="status" aria-live="polite"></div>

      <!-- SECTION 1 & 2: THÔNG TIN ĐƠN HÀNG & KHÁCH HÀNG (2 CỘT 50-50) -->
      <div class="order-top-grid">
        
        <!-- CỘT TRÁI: THÔNG TIN ĐƠN HÀNG -->
        <div class="section-card">
          <div class="section-card-title">
            <i class="fa-solid fa-file-pen"></i> Thông Tin Đơn Hàng
          </div>
          <div class="form-grid order-detail-grid">
            <div class="form-group">
              <label class="form-label">Mã Đơn Hàng (Tự động)</label>
              <input type="text" id="new_maDon" class="form-input" readonly style="font-weight: bold; color: var(--primary);">
            </div>
            <div class="form-group">
              <label class="form-label">Ngày Đăng Ký (DD/MM/YYYY)</label>
              <input type="text" id="new_ngayDK" class="form-input" placeholder="DD/MM/YYYY">
            </div>
            <div class="form-group">
              <label class="form-label">Người Đăng Ký</label>
              <select id="new_nhanVien" class="form-select">
                <option value="">-- Chọn nhân viên --</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Nhân Viên Nhập</label>
              <select id="new_nhanVienNhap" class="form-select">
                <option value="">-- Chọn nhân viên nhập --</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Trạng Thái</label>
              <select id="new_tinhTrang" class="form-select status-soan-ho-so" onchange="capNhatMauTinhTrang()">
                <option value="Soạn Hồ Sơ">Soạn Hồ Sơ</option>
                <option value="Đã Đăng Ký">Đã Đăng Ký</option>
                <option value="Đang Xử Lý">Đang Xử Lý</option>
                <option value="Đã Duyệt">Đã Duyệt</option>
                <option value="Đã Kích Hoạt">Đã Kích Hoạt</option>
                <option value="Hoàn Tất">Hoàn Tất</option>
                <option value="Đã Thanh Toán">Đã Thanh Toán</option>
                <option value="Từ Chối">Từ Chối</option>
              </select>
            </div>
          </div>
        </div>

        <!-- CỘT PHẢI: THÔNG TIN KHÁCH HÀNG -->
        <div class="section-card">
          <div class="section-card-title">
            <i class="fa-solid fa-user-tie"></i> Thông Tin Khách Hàng
          </div>
          <div class="form-grid customer-detail-grid">
            <div class="form-group mst-field">
              <div class="mst-label-row">
                <label class="form-label" for="new_mst">Mã Số Thuế (MST) *</label>
                <div id="mstLoading" aria-live="polite" style="font-size: 0.8rem; color: var(--text-muted);"></div>
              </div>
              <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="new_mst" class="form-input" placeholder="10 số, 12 số hoặc 10-3" maxlength="14" inputmode="numeric" style="flex: 1;" oninput="formatMstTyping(this)" onblur="lookupMST()">
                <button class="btn btn-primary" id="btnLookupMST" onclick="lookupMST()" style="flex: 0 0 auto; padding: 0.75rem 1rem; font-size: 0.85rem;">
                  <i class="fa-solid fa-magnifying-glass"></i> Tra
                </button>
              </div>
            </div>
            <input type="hidden" id="new_customerId">
            <div class="form-group company-field">
              <label class="form-label">Tên Công Ty</label>
              <input type="text" id="new_congTy" class="form-input" placeholder="Tên công ty...">
            </div>
            <div class="form-group address-field">
              <label class="form-label">Địa Chỉ Công Ty</label>
              <input type="text" id="new_diaChiCongTy" class="form-input" placeholder="Địa chỉ công ty...">
            </div>
            <div class="customer-detail-divider" aria-hidden="true"></div>
            <div class="form-group contact-field">
              <label class="form-label">Tên Khách Hàng</label>
              <input type="text" id="new_tenKH" class="form-input" list="customerDatalist" placeholder="Gõ để tìm khách hàng..." oninput="searchCustomers()" onchange="fillCustomerFromList()">
              <datalist id="customerDatalist"></datalist>
              <div id="customerSearchStatus" class="form-status" aria-live="polite"></div>
            </div>
            <div class="form-group contact-field">
              <label class="form-label">Số Điện Thoại</label>
              <input type="text" id="new_sdt" class="form-input" placeholder="Nhập SĐT...">
            </div>
            <div class="form-group contact-field">
              <label class="form-label" for="new_diaChiGiaoNhan">Địa Chỉ Giao Nhận</label>
              <input type="text" id="new_diaChiGiaoNhan" class="form-input" placeholder="Nhập địa chỉ giao nhận...">
            </div>
            <div class="form-group contact-field">
              <label class="form-label" for="new_email">Email</label>
              <input type="email" id="new_email" class="form-input" placeholder="Nhập email...">
            </div>
          </div>
        </div>

      </div>

      <div class="order-bottom-grid">
      <!-- SECTION 3: SẢN PHẨM & DỊCH VỤ -->
      <div class="section-card">
        <div class="section-card-title">
          <i class="fa-solid fa-box"></i> Chọn Sản Phẩm & Dịch Vụ
        </div>
        <div class="form-grid two-col">
          <div class="form-group">
            <label class="form-label">Loại Sản Phẩm</label>
            <select id="new_loaiSP" class="form-select" onchange="onLoaiSPChange()">
              <option value="">-- Chọn Loại Sản Phẩm --</option>
              <option value="CHỮ KÝ SỐ">CHỮ KÝ SỐ</option>
              <option value="BHXH">BHXH</option>
              <option value="HĐĐT">HĐĐT</option>
              <option value="LOGO">LOGO</option>
              <option value="Phần Mềm Kế Toán">Phần Mềm Kế Toán</option>
              <option value="FPT-GS eContract">FPT-GS eContract</option>
              <option value="Máy in bill">Máy in bill</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">NCC (Nhà Cung Cấp)</label>
            <select id="new_ncc" class="form-select" onchange="onNCCChange()" disabled>
              <option value="">-- Chọn NCC --</option>

          <div class="form-group">
            <label class="form-label">Hình Thức</label>
            <select id="new_hinhThuc" class="form-select" onchange="onHinhThucChange()" disabled>
              <option value="">-- Chọn Hình Thức --</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Gói Cước *</label>
            <select id="new_goi" class="form-select" onchange="onGoiChange()" disabled>
              <option value="">-- Chọn Gói Cước --</option>
            </select>

        <div id="productLoading" class="form-status" aria-live="polite"></div>
        <div id="packagePager" class="select-pager" hidden>
          <button type="button" id="packagePrev" onclick="changePackagePage(-1)">Trước</button>
          <span id="packagePageLabel"></span>
          <button type="button" id="packageNext" onclick="changePackagePage(1)">Tiếp</button>

        <div class="form-grid" style="margin-top: 1.2rem; gap: 0.8rem;">
          <div class="form-group">
            <label class="form-label">Thành Tiền (VNĐ)</label>
            <input type="number" id="new_thanhTien" class="form-input" readonly style="font-weight: bold;">

          <div class="form-group">
            <label class="form-label">Thực Thu (VNĐ)</label>
            <input type="number" id="new_thucThu" class="form-input" style="font-weight: bold; color: #34d399;">
          </div>
          <div class="form-group">
            <label class="form-label">Thực Đóng NCC (VNĐ)</label>
            <input type="number" id="new_thucDongNCC" class="form-input" readonly style="font-weight: bold; color: #f43f5e;">
          </div>
          <div class="form-group">
            <label class="form-label">CÔNG NỢ CÔNG TY (VNĐ)</label>
            <input type="number" id="new_thucDongCuoiCung" class="form-input" readonly style="font-weight: bold; color: #f59e0b;">
          </div>
        </div>
      </div>

      <!-- SECTION 4: HỒ SƠ ĐÍNH KÈM -->
      <div class="section-card">
        <div class="section-card-title">
          <i class="fa-solid fa-paperclip"></i> Hồ Sơ Đính Kèm
        </div>
        <div id="hoSoDinhKemContainer"></div>
      </div>

    </div>

  <!-- STICKY FOOTER -->
  <div class="form-footer">
    <button class="btn btn-secondary" onclick="resetForm()">
      <i class="fa-solid fa-rotate-left"></i> Xóa
    </button>
    <button class="btn btn-primary" onclick="submitCreateOrder()">
      <i class="fa-solid fa-check"></i> Tạo Mới Đơn Hàng
    </button>
  </div>

  <dialog id="formNoticeDialog" class="form-notice-dialog" aria-labelledby="formNoticeTitle" aria-describedby="formNoticeMessage">
    <div class="form-notice-content">
      <div id="formNoticeIcon" class="form-notice-icon" aria-hidden="true"><i class="fa-solid fa-circle-info"></i></div>
      <div class="form-notice-copy">
        <h2 id="formNoticeTitle">Thông báo</h2>
        <p id="formNoticeMessage"></p>
      </div>
    </div>
    <div class="form-notice-actions">
      <button id="formNoticeCancel" class="btn btn-secondary" type="button" data-dialog-result="cancel">Hủy</button>
      <button id="formNoticeConfirm" class="btn btn-primary" type="button" data-dialog-result="confirm">Đã hiểu</button>
    </div>
  </dialog>

  <script src="public/js/theme.js"></script>
  <script>
    let nhanVienOptions = [];
    let danhSachGoiTrangHienTai = [];
    let trangGoiHienTai = 1;
    let goiCoTrangTiep = false;
    let timKhachHangTimer = null;
    let maYeuCauKhachHang = 0;
    let maYeuCauMST = 0;
    let maYeuCauSanPham = { new_ncc: 0, new_hinhThuc: 0, new_goi: 0 };
    let ketQuaTimKhachHang = [];

    function authenticatedFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      const token = localStorage.getItem('datags_auth_token') || '';
      if (token) headers.set('Authorization', `Bearer ${token}`);
      return fetch(url, { ...options, headers });
    }

    async function fetchApiData(url, options) {
      const response = await authenticatedFetch(url, options);
      const result = await response.json();
      if (!response.ok || result.success === false) {
        throw new Error(result.message || `Yêu cầu thất bại (${response.status})`);
      }
      return result.data;
    }

    function setFormStatus(elementId, message, type = '') {
      const element = document.getElementById(elementId);
      if (!element) return;
      element.textContent = message;
      element.className = `form-status${type ? ` ${type}` : ''}`;
    }

    function hienThongBao(message, options = {}) {
      const dialog = document.getElementById('formNoticeDialog');
      const laXacNhan = options.xacNhan === true;
      const type = options.loai || 'info';
      const icons = {
        info: 'fa-circle-info',
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        warning: 'fa-triangle-exclamation'
      };
      dialog.dataset.type = type;
      document.getElementById('formNoticeTitle').textContent = options.tieuDe || (laXacNhan ? 'Xác nhận' : 'Thông báo');
      document.getElementById('formNoticeMessage').textContent = String(message ?? '');
      document.getElementById('formNoticeIcon').innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i>`;
      const cancelButton = document.getElementById('formNoticeCancel');
      const confirmButton = document.getElementById('formNoticeConfirm');
      cancelButton.hidden = !laXacNhan;
      cancelButton.textContent = options.nhanHuy || 'Hủy';
      confirmButton.textContent = options.nhanXacNhan || (laXacNhan ? 'Xác nhận' : 'Đã hiểu');
      return new Promise(resolve => {
        dialog.addEventListener('close', () => resolve(dialog.returnValue === 'confirm'), { once: true });
        dialog.showModal();
        confirmButton.focus();
      });
    }

    document.getElementById('formNoticeDialog').addEventListener('click', event => {
      const button = event.target.closest('[data-dialog-result]');
      if (button) document.getElementById('formNoticeDialog').close(button.dataset.dialogResult);
    });

    async function xacNhanBangThongBao(message, options = {}) {
      return hienThongBao(message, { ...options, xacNhan: true, loai: options.loai || 'warning' });
    }

    // Khởi tạo trang
    async function initializeAddOrderPage() {
      setCurrentDate();
      capNhatMauTinhTrang();
      await Promise.all([loadNextOrderCode(), loadEmployeeOptions(), loadProductTypes()]);
    }

    function capNhatMauTinhTrang() {
      const trangThai = document.getElementById('new_tinhTrang');
      trangThai.classList.toggle('status-soan-ho-so', trangThai.value === 'Soạn Hồ Sơ');
    }

    async function loadNextOrderCode() {
      try {
        const data = await fetchApiData('/api/orders/next-code');
        document.getElementById('new_maDon').value = data.code || '';
      } catch (error) {
        setFormStatus('formLoadStatus', `Không thể tạo mã đơn hàng: ${error.message}`, 'error');
      }
    }

    async function loadEmployeeOptions() {
      try {
        const data = await fetchApiData('/api/employees/options');
        nhanVienOptions = Array.isArray(data) ? data : [];
        ['new_nhanVien', 'new_nhanVienNhap'].forEach(elementId => {
          const select = document.getElementById(elementId);
          select.replaceChildren(new Option('-- Chọn nhân viên --', ''));
          nhanVienOptions.forEach(employee => {
            if (employee.name) select.add(new Option(employee.name, employee.name));
          });
        });
      } catch (error) {
        setFormStatus('formLoadStatus', `Không thể tải danh sách nhân viên: ${error.message}`, 'error');
      }
    }

    async function loadProductTypes() {
      try {
        const data = await fetchApiData('/api/sanpham/order-options');
        const select = document.getElementById('new_loaiSP');
        const existing = new Set([...select.options].map(option => option.value));
        (data.values || []).forEach(value => {
          if (value && !existing.has(value)) select.add(new Option(value, value));
        });
        if (data.hasMore) setFormStatus('productLoading', 'Danh sách loại sản phẩm vượt quá 100 lựa chọn; cần thu hẹp danh mục.');
      } catch (error) {
        setFormStatus('productLoading', `Không thể tải danh mục sản phẩm: ${error.message}`, 'error');
      }
    }

    // Đặt ngày hiện tại
    function setCurrentDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      document.getElementById('new_ngayDK').value = `${dd}/${mm}/${yyyy}`;
    }

    function canonicalMST(value) {
      const raw = String(value || '').trim().replace(/[.\s]/g, '');
      const branch = raw.match(/^(\d{10})-(\d{1,3})$/);
      if (branch) return `${branch[1]}-${branch[2].padStart(3, '0')}`;
      const digits = raw.replace(/\D/g, '');
      if (digits.length === 13) return `${digits.slice(0, 10)}-${digits.slice(10)}`;
      if (digits.length === 12 || digits.length === 11) return digits;
      return digits.padStart(10, '0');
    }

    function formatMstTyping(input) {
      const digits = String(input.value || '').replace(/\D/g, '').slice(0, 13);
      input.value = digits.length === 13 ? `${digits.slice(0, 10)}-${digits.slice(10)}` : digits;
    }

    function fillCustomerFields(customer) {
      document.getElementById('new_customerId').value = customer._id || customer.customerId || '';
      document.getElementById('new_tenKH').value = customer.tenKH || customer.name || '';
      document.getElementById('new_sdt').value = customer.sdt || customer.phone || '';
      const congTyInput = document.getElementById('new_congTy');
      const diaChiInput = document.getElementById('new_diaChiCongTy');
      const diaChiGiaoNhanInput = document.getElementById('new_diaChiGiaoNhan');
      const emailInput = document.getElementById('new_email');
      if (!congTyInput.value.trim()) congTyInput.value = customer.congTy || customer.company || '';
      if (!diaChiInput.value.trim()) diaChiInput.value = customer.diaChiCongTy || customer.deliveryAddress || '';
      if (!diaChiGiaoNhanInput.value.trim()) diaChiGiaoNhanInput.value = customer.diaChiGiaoNhan || customer.deliveryAddress || '';
      if (!emailInput.value.trim()) emailInput.value = customer.email || '';
      if (customer.mst) document.getElementById('new_mst').value = customer.mst;
    }

    // Tra cứu khách hàng đã lưu, sau đó tra cứu thông tin doanh nghiệp theo MST.
    async function lookupMST() {
      const input = document.getElementById('new_mst');
      const mst = canonicalMST(input.value);
      const loadingEl = document.getElementById('mstLoading');
      if (!mst || mst.replace(/\D/g, '').length < 5) return;
      input.value = mst;
      const requestId = ++maYeuCauMST;
      try {
        loadingEl.textContent = '⏳ Đang tra cứu...';
        const response = await authenticatedFetch(`/api/customers/search-by-mst?mst=${encodeURIComponent(mst)}`);
        const result = await response.json();
        if (requestId !== maYeuCauMST) return;
        if (response.ok && result.success && result.data) {
          fillCustomerFields(result.data);
          loadingEl.textContent = '✓ Đã lấy thông tin khách hàng';
        } else if (response.status === 404 || response.status === 403) {
          const externalResponse = await fetch(`https://api.vietqr.io/v2/business/${encodeURIComponent(mst)}`);
          const externalResult = await externalResponse.json();
          if (requestId !== maYeuCauMST) return;
          if (externalResponse.ok && externalResult.code === '00' && externalResult.data) {
            const congTyInput = document.getElementById('new_congTy');
            const diaChiInput = document.getElementById('new_diaChiCongTy');
            if (!congTyInput.value.trim()) congTyInput.value = externalResult.data.name || '';
            if (!diaChiInput.value.trim()) diaChiInput.value = externalResult.data.address || externalResult.data.diaChi || externalResult.data.addresses || '';
            loadingEl.textContent = '✓ Đã tra cứu thông tin doanh nghiệp';
          } else {
            loadingEl.textContent = '✗ Không tìm thấy thông tin MST';
          }
        } else {
          throw new Error(result.message || `Tra cứu MST thất bại (${response.status})`);
        }
      } catch (error) {
        if (requestId !== maYeuCauMST) return;
        console.error('Lỗi tra cứu MST:', error);
        loadingEl.textContent = `✗ Lỗi tra cứu: ${error.message}`;
      }
    }

    function searchCustomers() {
      clearTimeout(timKhachHangTimer);
      const query = document.getElementById('new_tenKH').value.trim();
      document.getElementById('new_customerId').value = '';
      const datalist = document.getElementById('customerDatalist');
      const requestId = ++maYeuCauKhachHang;
      if (query.length < 2) {
        datalist.replaceChildren();
        ketQuaTimKhachHang = [];
        setFormStatus('customerSearchStatus', query ? 'Nhập ít nhất 2 ký tự để tìm khách hàng.' : '');
        return;
      }
      timKhachHangTimer = setTimeout(async () => {
        try {
          setFormStatus('customerSearchStatus', 'Đang tìm khách hàng...');
          const params = new URLSearchParams({ page: '1', limit: '20', q: query });
          const data = await fetchApiData(`/api/customers?${params}`);
          if (requestId !== maYeuCauKhachHang) return;
          ketQuaTimKhachHang = Array.isArray(data) ? data : [];
          datalist.replaceChildren(...ketQuaTimKhachHang.map(customer => {
            const option = new Option(customer.name || '', customer.name || '');
            option.label = `${customer.code || 'KH'}${customer.phone ? ` - ${customer.phone}` : ''}`;
            return option;
          }));
          setFormStatus('customerSearchStatus', ketQuaTimKhachHang.length ? `${ketQuaTimKhachHang.length} khách hàng phù hợp.` : 'Không tìm thấy khách hàng.');
          fillCustomerFromList();
        } catch (error) {
          if (requestId === maYeuCauKhachHang) setFormStatus('customerSearchStatus', `Lỗi tìm khách hàng: ${error.message}`, 'error');
        }
      }, 350);
    }

    function fillCustomerFromList() {
      const name = document.getElementById('new_tenKH').value.trim().toLocaleLowerCase('vi');
      const customer = ketQuaTimKhachHang.find(item => String(item.name || '').trim().toLocaleLowerCase('vi') === name);
      if (customer) fillCustomerFields(customer);
    }

    function resetSelect(select, placeholder, values = [], disabled = true) {
      select.replaceChildren(new Option(placeholder, ''));
      [...new Set(values.filter(Boolean))].forEach(value => select.add(new Option(value, value)));
      select.disabled = disabled;
    }

    function productQuery() {
      const params = new URLSearchParams();
      const loaiSP = document.getElementById('new_loaiSP').value;
      const ncc = document.getElementById('new_ncc').value;
      const hinhThuc = document.getElementById('new_hinhThuc').value;
      if (loaiSP) params.set('loaiSP', loaiSP);
      if (ncc) params.set('ncc', ncc);
      if (hinhThuc) params.set('hinhThuc', hinhThuc);
      return params;
    }

    async function loadProductOptions(selectId, placeholder, page = null) {
      const requestId = ++maYeuCauSanPham[selectId];
      const params = productQuery();
      if (page !== null) params.set('page', String(page));
      const data = await fetchApiData(`/api/sanpham/order-options?${params}`);
      if (requestId !== maYeuCauSanPham[selectId]) return null;
      const select = document.getElementById(selectId);
      if (selectId === 'new_goi') {
        danhSachGoiTrangHienTai = data.products || [];
        goiCoTrangTiep = Boolean(data.hasMore);
        resetSelect(select, placeholder, [], false);
        danhSachGoiTrangHienTai.forEach(product => {
          const tenGoi = product['TÊN SẢN PHẨM'] || product['Tên Sản Phẩm'] || product['Gói '] || product.Gói || 'Gói cước';
          const gia = parseMoneyValue(product['GIÁ SAU THUẾ'] ?? product['SAU THUẾ'] ?? product['Giá Sau Thuế'] ?? product['Gia Sau Thuế'] ?? 0);
          select.add(new Option(`${tenGoi} (${gia.toLocaleString('vi-VN')} đ)`, String(product._id)));
        });
        trangGoiHienTai = data.page || page || 1;
        const pager = document.getElementById('packagePager');
        pager.hidden = trangGoiHienTai === 1 && !goiCoTrangTiep;
        document.getElementById('packagePrev').disabled = trangGoiHienTai <= 1;
        document.getElementById('packageNext').disabled = !goiCoTrangTiep;
        document.getElementById('packagePageLabel').textContent = `Trang ${trangGoiHienTai}`;
      } else {
        const values = data.values || [];
        resetSelect(select, placeholder, values, !values.length);
      }
      return data;
    }

    function clearFinancials() {
      ['new_thanhTien', 'new_thucThu', 'new_thucDongNCC', 'new_thucDongCuoiCung'].forEach(id => {
        document.getElementById(id).value = '';
      });
    }

    async function onLoaiSPChange() {
      maYeuCauSanPham.new_ncc += 1;
      maYeuCauSanPham.new_hinhThuc += 1;
      maYeuCauSanPham.new_goi += 1;
      danhSachGoiTrangHienTai = [];
      document.getElementById('packagePager').hidden = true;
      const loaiSP = document.getElementById('new_loaiSP').value;
      resetSelect(document.getElementById('new_ncc'), '-- Chọn NCC --');
      resetSelect(document.getElementById('new_hinhThuc'), '-- Chọn Hình Thức --');
      resetSelect(document.getElementById('new_goi'), '-- Chọn Gói Cước Chi Tiết --');
      clearFinancials();
      if (!loaiSP) return setFormStatus('productLoading', '');
      try {
        const data = await loadProductOptions('new_ncc', '-- Chọn NCC --');
        setFormStatus('productLoading', data?.hasMore ? 'Danh sách NCC vượt quá 100 lựa chọn.' : document.getElementById('new_ncc').options.length > 1 ? '' : 'Không có NCC cho loại sản phẩm này.');
      } catch (error) {
        setFormStatus('productLoading', `Không thể tải danh sách NCC: ${error.message}`, 'error');
      }
    }

    async function onNCCChange() {
      maYeuCauSanPham.new_hinhThuc += 1;
      maYeuCauSanPham.new_goi += 1;
      danhSachGoiTrangHienTai = [];
      document.getElementById('packagePager').hidden = true;
      resetSelect(document.getElementById('new_hinhThuc'), '-- Chọn Hình Thức --');
      resetSelect(document.getElementById('new_goi'), '-- Chọn Gói Cước Chi Tiết --');
      clearFinancials();
      if (!document.getElementById('new_ncc').value) return setFormStatus('productLoading', '');
      try {
        const data = await loadProductOptions('new_hinhThuc', '-- Chọn Hình Thức --');
        setFormStatus('productLoading', data?.hasMore ? 'Danh sách hình thức vượt quá 100 lựa chọn.' : document.getElementById('new_hinhThuc').options.length > 1 ? '' : 'Không có hình thức phù hợp với NCC này.');
      } catch (error) {
        setFormStatus('productLoading', `Không thể tải hình thức: ${error.message}`, 'error');
      }
    }

    async function onHinhThucChange() {
      maYeuCauSanPham.new_goi += 1;
      danhSachGoiTrangHienTai = [];
      document.getElementById('packagePager').hidden = true;
      resetSelect(document.getElementById('new_goi'), '-- Chọn Gói Cước Chi Tiết --');
      clearFinancials();
      if (!document.getElementById('new_hinhThuc').value) return setFormStatus('productLoading', '');
      try {
        await loadProductOptions('new_goi', '-- Chọn Gói Cước Chi Tiết --', 1);
        setFormStatus('productLoading', danhSachGoiTrangHienTai.length ? '' : 'Không có gói cước phù hợp.');
      } catch (error) {
        setFormStatus('productLoading', `Không thể tải gói cước: ${error.message}`, 'error');
      }
    }

    async function changePackagePage(offset) {
      const page = trangGoiHienTai + offset;
      if (page < 1 || (offset > 0 && !goiCoTrangTiep)) return;
      try {
        clearFinancials();
        await loadProductOptions('new_goi', '-- Chọn Gói Cước Chi Tiết --', page);
      } catch (error) {
        setFormStatus('productLoading', `Không thể tải trang gói cước: ${error.message}`, 'error');
      }
    }

    function parseMoneyValue(value) {
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      return Number(String(value ?? '').replace(/[^0-9-]/g, '')) || 0;
    }

    function onGoiChange() {
      const selectedId = document.getElementById('new_goi').value;
      const product = danhSachGoiTrangHienTai.find(item => String(item._id) === selectedId);
      if (!product) return clearFinancials();
      document.getElementById('new_thanhTien').value = parseMoneyValue(product['GIÁ SAU THUẾ'] ?? product['SAU THUẾ'] ?? product['Giá Sau Thuế'] ?? product['Gia Sau Thuế'] ?? 0);
      document.getElementById('new_thucThu').value = '';
      document.getElementById('new_thucDongNCC').value = parseMoneyValue(product['THỰC ĐÓNG CÔNG TY'] ?? product['Thực Đóng Công Ty'] ?? 0);
      document.getElementById('new_thucDongCuoiCung').value = parseMoneyValue(product['THỰC CÔNG NỢ CTY'] ?? product['THỰC CÔNG NỢ CTY (VNĐ)'] ?? 0);
    }

    function goBack() {
      sessionStorage.setItem('addOrderReturnRequested', '1');
      const previousUrl = document.referrer ? new URL(document.referrer) : null;
      if (previousUrl?.origin === window.location.origin && previousUrl.pathname !== '/add-order' && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.replace('/');
      }
    }

    async function resetForm() {
      if (!await xacNhanBangThongBao('Bạn chắc chắn muốn xóa toàn bộ dữ liệu?', { tieuDe: 'Xóa thông tin đã nhập' })) return;
      ['new_nhanVien', 'new_nhanVienNhap', 'new_customerId', 'new_tenKH', 'new_sdt', 'new_mst', 'new_congTy', 'new_diaChiCongTy', 'new_diaChiGiaoNhan', 'new_email'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('new_tinhTrang').value = 'Soạn Hồ Sơ';
      capNhatMauTinhTrang();
      document.getElementById('new_loaiSP').value = '';
      resetSelect(document.getElementById('new_ncc'), '-- Chọn NCC --');
      resetSelect(document.getElementById('new_hinhThuc'), '-- Chọn Hình Thức --');
      resetSelect(document.getElementById('new_goi'), '-- Chọn Gói Cước Chi Tiết --');
      document.getElementById('packagePager').hidden = true;
      document.getElementById('customerDatalist').replaceChildren();
      document.getElementById('mstLoading').textContent = '';
      setFormStatus('customerSearchStatus', '');
      setFormStatus('productLoading', '');
      clearFinancials();
      clearTimeout(timKhachHangTimer);
      maYeuCauKhachHang += 1;
      ketQuaTimKhachHang = [];
      ['new_fileHopDong', 'new_fileXacNhan', 'new_fileGpkd', 'new_fileCccd', 'new_fileTong'].forEach(id => {
        const input = document.getElementById(id);
        input.value = '';
        hienTenTepDinhKem({ target: input });
      });
      loadNextOrderCode();
      setCurrentDate();
    }

    function hienTenTepDinhKem(event) {
      const input = event.target;
      const tenTep = input.files[0]?.name || 'Chưa chọn tệp';
      const tenTepEl = input.closest('.file-upload-row')?.querySelector('.file-upload-name');
      if (tenTepEl) {
        tenTepEl.textContent = tenTep;
        tenTepEl.title = tenTep;
      }
    }

    function readOrderAttachment(inputId) {
      const file = document.getElementById(inputId).files[0];
      if (!file) return Promise.resolve('');
      if (inputId === 'new_fileTong' && !/\.(rar|zip)$/i.test(file.name)) {
        return Promise.reject(new Error('File tổng chỉ nhận định dạng RAR hoặc ZIP.'));
      }
      if (file.size > 5 * 1024 * 1024) return Promise.reject(new Error(`File ${file.name} vượt quá 5MB.`));
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`Không thể đọc file ${file.name}.`));
        reader.readAsDataURL(file);
      });
    }

    async function submitCreateOrder() {
      const selectedProduct = danhSachGoiTrangHienTai.find(product => String(product._id) === document.getElementById('new_goi').value);
      if (!selectedProduct) {
        await hienThongBao('Vui lòng chọn gói cước trước khi tạo đơn hàng.', { tieuDe: 'Chưa chọn gói cước', loai: 'warning' });
        return;
      }

      const button = document.querySelector('.form-footer .btn-primary');
      button.disabled = true;
      try {
        const attachments = await Promise.all(['new_fileHopDong', 'new_fileXacNhan', 'new_fileGpkd', 'new_fileCccd', 'new_fileTong'].map(readOrderAttachment));
        const chiPhiNcc = parseMoneyValue(selectedProduct['THỰC ĐÓNG CÔNG TY'] ?? selectedProduct['Thực Đóng Công Ty'] ?? document.getElementById('new_thucDongNCC').value);
        const congNoCongTy = parseMoneyValue(selectedProduct['THỰC CÔNG NỢ CTY'] ?? selectedProduct['THỰC CÔNG NỢ CTY (VNĐ)'] ?? document.getElementById('new_thucDongCuoiCung').value);
        const tenGoi = selectedProduct['TÊN SẢN PHẨM'] || selectedProduct['Tên Sản Phẩm'] || selectedProduct['Gói '] || selectedProduct.Gói || '';
        const donHang = {
          customerId: document.getElementById('new_customerId').value,
          'Mã Đơn Hàng': document.getElementById('new_maDon').value,
          'Ngày Đăng Ký': document.getElementById('new_ngayDK').value,
          'Nhân Viên Đăng Ký': document.getElementById('new_nhanVien').value,
          'Nhân Viên Nhập Liệu': document.getElementById('new_nhanVienNhap').value,
          'Tên Khách Hàng': document.getElementById('new_tenKH').value.trim(),
          'SĐT': document.getElementById('new_sdt').value.trim(),
          'Tên Công Ty ': document.getElementById('new_congTy').value.trim(),
          'Địa Chỉ Công Ty': document.getElementById('new_diaChiCongTy').value.trim(),
          'Địa Chỉ Giao Nhận': document.getElementById('new_diaChiGiaoNhan').value.trim(),
          Email: document.getElementById('new_email').value.trim(),
          MST: canonicalMST(document.getElementById('new_mst').value),
          NCC: document.getElementById('new_ncc').value,
          'Loại Sản Phẩm': document.getElementById('new_loaiSP').value,
          'Hình Thức': document.getElementById('new_hinhThuc').value,
          'Gói ': tenGoi,
          'Thành Tiền': parseMoneyValue(document.getElementById('new_thanhTien').value),
          'KH Thanh Toán': parseMoneyValue(document.getElementById('new_thucThu').value),
          'Thực Đóng NCC': chiPhiNcc,
          'Thực Đóng Công Ty': chiPhiNcc,
          'THỰC CÔNG NỢ CTY': congNoCongTy,
          'TÌNH TRẠNG': document.getElementById('new_tinhTrang').value,
          'Hợp Đồng / GDK': attachments[0],
          'Xác Nhận/ BBBG': attachments[1],
          GPKD: attachments[2],
          CCCD: attachments[3],
          'File tong': attachments[4]
        };
        const response = await authenticatedFetch('/api/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(donHang)
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Không thể tạo đơn hàng.');
        sessionStorage.setItem('addOrderSuccessCode', result.data?.['Mã Đơn Hàng'] || donHang['Mã Đơn Hàng']);
        goBack();
      } catch (error) {
        console.error('Lỗi gửi form:', error);
        await hienThongBao(`Lỗi khi tạo đơn hàng: ${error.message}`, { tieuDe: 'Không thể tạo đơn hàng', loai: 'error' });
      } finally {
        button.disabled = false;
      }
    }

    // Khởi tạo khi trang tải
    document.addEventListener('DOMContentLoaded', initializeAddOrderPage);
  </script>
  <script src="public/js/hoSoDinhKem.js"></script>
  <script>
    // Khởi tạo Hộ Số Định Kèm Component
    document.addEventListener('DOMContentLoaded', () => {
      const hoSoDinhKem = new HoSoDinhKem('hoSoDinhKemContainer', {
        onValidationError: (msg) => hienThongBao(msg, { loai: 'error', tieuDe: 'Lỗi Upload' }),
        onFileChange: (fieldId, file) => console.log(`[HoSoDinhKem] ${fieldId}:`, file.name)
      });

      // Override nút submit để lấy files từ component
      window.onHoSoDinhKemSubmit = (result) => {
        hienThongBao('Upload thành công! Đơn hàng đã được tạo.', { 
          loai: 'success', 
          tieuDe: 'Thành công' 
        });
        setTimeout(() => window.location.href = '/orders', 1500);
      };

      // Expose để access từ form chính nếu cần
      window.hoSoDinhKem = hoSoDinhKem;
    });
  </script>
