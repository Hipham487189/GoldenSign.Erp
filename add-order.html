<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thêm Đơn Hàng Mới - DATAGS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <script src="public/js/theme.js"></script>
  <link rel="stylesheet" href="public/css/components.css">
  <style>
*, *::before, *::after {
  box-sizing: border-box;
  padding: 0;
  margin: 0;
}

:root {
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --primary: #0284c7;
  --primary-hover: #0369a1;
  --primary-2: #06b6d4;
  --primary-gradient: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
  --success-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
  --danger-gradient: linear-gradient(135deg, #e11d48 0%, #f43f5e 100%);
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;
}

body:not(.light-mode) {
  --bg-main: #070e1a;
  --bg-gradient: radial-gradient(circle at 18% -8%, rgba(14, 165, 233, 0.16), transparent 38%),
                 radial-gradient(circle at 88% 95%, rgba(6, 182, 212, 0.11), transparent 34%),
                 #070e1a;
  --bg-card: rgba(13, 22, 38, 0.72);
  --bg-card-solid: #0c1729;
  --border-color: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-subtle: #64748b;
  --input-bg: rgba(9, 16, 29, 0.72);
  --input-border: rgba(255, 255, 255, 0.10);
  --input-focus: #38bdf8;
  --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.38);
}

body.light-mode {
  --bg-main: #c9dde0;
  --bg-gradient: radial-gradient(circle at 18% -8%, rgba(20, 184, 166, 0.16), transparent 38%),
                 radial-gradient(circle at 88% 95%, rgba(2, 132, 199, 0.13), transparent 34%),
                 #c9dde0;
  --bg-card: rgba(238, 248, 250, 0.94);
  --bg-card-solid: #eef8fa;
  --border-color: rgba(15, 91, 105, 0.14);
  --border-strong: rgba(15, 91, 105, 0.24);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  --input-bg: #f7fcfd;
  --input-border: rgba(15, 91, 105, 0.16);
  --input-focus: #0284c7;
  --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.08);
}

html {
  height: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  flex-direction: column;
  background: var(--bg-gradient);
  color: var(--text-main);
  height: 100vh;
  overflow: hidden;
  font-family: var(--font-sans);
  letter-spacing: -0.01em;
}

a, button, input, select, textarea {
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

/* TOP HEADER */
.page-header {
  background: var(--bg-card-solid);
  border-bottom: 1px solid var(--border-color);
  padding: 1.2rem 1.8rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-sm);
}

.page-header-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.page-header-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.page-header-title i {
  font-size: 1.8rem;
  color: var(--primary);
  filter: drop-shadow(0 0 8px rgba(2, 132, 199, 0.3));
}

.page-header-subtitle {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.page-header-actions {
  display: flex;
  gap: 0.8rem;
  align-items: center;
}

/* MAIN CONTENT */
.page-container {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 2.5rem;
  display: flex;
  justify-content: center;
}

.form-wrapper {
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* SECTION CARD */
.section-card {
  background: var(--bg-card-solid);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1.8rem;
  box-shadow: var(--shadow-sm);
  animation: slideUp 0.4s ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.section-card-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1.3rem;
  padding-bottom: 0.8rem;
  border-bottom: 2px solid var(--border-color);
}

.section-card-title i {
  font-size: 1.3rem;
  color: var(--primary);
}

/* FORM GRID */
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.2rem;
}

.form-grid.full {
  grid-template-columns: 1fr;
}

.form-grid.two-col {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.form-label {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-main);
}

.form-input,
.form-select {
  padding: 0.75rem 0.95rem;
  border: 1px solid var(--input-border);
  border-radius: var(--radius-md);
  background: var(--input-bg);
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
}

.form-input:focus,
.form-select:focus {
  border-color: var(--input-focus);
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
}

.form-input:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* BUTTONS */
.btn {
  padding: 0.75rem 1.2rem;
  border: none;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  white-space: nowrap;
  transition: all 0.18s ease;
}

.btn-primary {
  background: var(--primary-gradient);
  color: white;
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--primary-hover) 0%, #0284c7 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text-main);
  border-color: var(--border-strong);
}

.btn-danger {
  background: rgba(244, 63, 94, 0.15);
  color: #f43f5e;
}

.btn-danger:hover {
  background: rgba(244, 63, 94, 0.25);
}

/* STICKY FOOTER */
.form-footer {
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
  align-items: center;
  position: sticky;
  bottom: 0;
  background: var(--bg-gradient);
  padding: 1.5rem 2.5rem;
  border-top: 1px solid var(--border-color);
  margin: -2rem -2.5rem 0 -2.5rem;
  padding-left: calc(2.5rem + 1100px - 100%);
  width: 100vw;
  max-width: 100%;
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.22);
  border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(56, 189, 248, 0.45);
}

@media (max-width: 1024px) {
  .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .page-container { padding: 1.5rem 1.5rem; }
}

@media (max-width: 768px) {
  .form-grid,
  .form-grid.two-col { grid-template-columns: 1fr; }
  .page-header { flex-wrap: wrap; }
  .page-header-actions { width: 100%; margin-top: 1rem; }
}
  </style>
</head>
<body>
  <!-- TOP HEADER -->

    <div class="page-header-left">

        <div>
          <div>Thêm Đơn Hàng Mới</div>

  <!-- MAIN FORM CONTAINER -->

    <div class="form-wrapper">

      <!-- SECTION 1: THÔNG TIN ĐƠN HÀNG -->
      <div class="section-card">
        <div class="section-card-title">
          <i class="fa-solid fa-file-pen"></i> Thông Tin Đơn Hàng
        </div>
        <div class="form-grid">
          <div class="form-group">

            </select>
          </div>
          <div class="form-group">

            <select id="new_tinhTrang" class="form-select">
              <option value="Soạn Hồ Sơ">Soạn Hồ Sơ</option>
              <option value="Đã Đăng Ký">Đã Đăng Ký</option>
              <option value="Đang Xử Lý">Đang Xử Lý</option>
              <option value="Đã Duyệt">Đã Duyệt</option>
              <option value="Đã Kích Hoạt">Đã Kích Hoạt</option>
              <option value="Hoàn Tất">Hoàn Tất</option>
              <option value="Đã Thanh Toán">Đã Thanh Toán</option>
              <option value="Từ Chối">Từ Chối</option>
            </select>
          </div>
        </div>
      </div>

      <!-- SECTION 2: THÔNG TIN KHÁCH HÀNG -->
      <div class="section-card">
        <div class="section-card-title">
          <i class="fa-solid fa-user-tie"></i> Thông Tin Khách Hàng
        </div>
        <div class="form-grid">
          <div class="form-group" style="grid-column: span 1;">
            <label class="form-label">Tên Khách Hàng</label>
            <input type="text" id="new_tenKH" class="form-input" list="customerDatalist" placeholder="Gõ để tìm khách hàng...">
            <datalist id="customerDatalist"></datalist>

  <script>
    let allOrders = [];

    // Khởi tạo trang
    async function initializeAddOrderPage() {
      try {
        // Lấy danh sách đơn hàng để tính mã đơn hàng tiếp theo
        const response = await fetch('/api/orders');
        if (response.ok) {
          allOrders = await response.json();
        }
        generateOrderCode();
        setCurrentDate();
      } catch (error) {
        console.error('Lỗi khởi tạo trang:', error);
      }
    }

    // Tạo mã đơn hàng tự động theo format: DH + MMYY + "-" + 5 chữ số (reset hàng năm)
    function generateOrderCode() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yy = String(now.getFullYear()).slice(-2);
      const datePrefix = `${mm}${yy}`;
      
      let nextNumber = 1;
      if (allOrders && allOrders.length > 0) {
        // Tìm các đơn hàng cùng tháng/năm (format: DH1126-00001)
        const currentMonthOrders = allOrders.filter(o => {
          const maDon = String(o['Mã Đơn Hàng'] || o['maDon'] || '').trim();
          // Kiểm tra format: DH + MMYY + "-" + 5 chữ số
          const match = maDon.match(/^DH(\d{4})-(\d{5})$/);
          if (match && match[1] === datePrefix) {
            return true;
          }
          return false;
        });
        
        if (currentMonthOrders.length > 0) {
          // Lấy số thứ tự lớn nhất của tháng hiện tại
          const numbers = currentMonthOrders.map(o => {
            const maDon = String(o['Mã Đơn Hàng'] || o['maDon'] || '').trim();
            const match = maDon.match(/^DH(\d{4})-(\d{5})$/);
            return match ? parseInt(match[2], 10) : 0;
          });
          const maxNum = Math.max(...numbers, 0);
          nextNumber = maxNum + 1;
        }
      }
      
      const sequenceNumber = String(nextNumber).padStart(5, '0');
      const generatedMaDon = `DH${datePrefix}-${sequenceNumber}`;
      document.getElementById('new_maDon').value = generatedMaDon;
    }

    // Đặt ngày hiện tại
    function setCurrentDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      document.getElementById('new_ngayDK').value = `${dd}/${mm}/${yyyy}`;
    }

    function goBack() {
      window.location.href = '/';
    }

    function resetForm() {
      if (!confirm('Bạn chắc chắn muốn xóa toàn bộ dữ liệu?')) return;
      document.getElementById('new_maDon').value = '';
      document.getElementById('new_ngayDK').value = '';
      document.getElementById('new_nhanVien').value = '';
      document.getElementById('new_nhanVienNhap').value = '';
      document.getElementById('new_tinhTrang').value = 'Soạn Hồ Sơ';
      document.getElementById('new_tenKH').value = '';
      document.getElementById('new_sdt').value = '';
      document.getElementById('new_mst').value = '';
      document.getElementById('new_congTy').value = '';
      document.getElementById('new_diaChiCongTy').value = '';
      document.getElementById('new_loaiSP').value = '';
      document.getElementById('new_ncc').value = '';
      document.getElementById('new_hinhThuc').value = '';
      document.getElementById('new_goi').value = '';
      document.getElementById('new_thanhTien').value = '';
      document.getElementById('new_thucThu').value = '';
      document.getElementById('new_thucDongNCC').value = '';
      document.getElementById('new_thucDongCuoiCung').value = '';
      
      // Reset files
      document.getElementById('new_fileCmt').value = '';
      document.getElementById('new_fileHopDong').value = '';
      document.getElementById('new_fileXacNhan').value = '';
      document.getElementById('new_fileGpkd').value = '';
      document.getElementById('new_fileCccd').value = '';
      
      generateOrderCode();
      setCurrentDate();
    }

    async function submitCreateOrder() {
      try {
        // Lấy dữ liệu từ form
        const formData = new FormData();
        formData.append('maDon', document.getElementById('new_maDon').value);
        formData.append('ngayDK', document.getElementById('new_ngayDK').value);
        formData.append('nhanVien', document.getElementById('new_nhanVien').value);
        formData.append('nhanVienNhap', document.getElementById('new_nhanVienNhap').value);
        formData.append('tinhTrang', document.getElementById('new_tinhTrang').value);
        formData.append('tenKH', document.getElementById('new_tenKH').value);
        formData.append('sdt', document.getElementById('new_sdt').value);
        formData.append('mst', document.getElementById('new_mst').value);
        formData.append('congTy', document.getElementById('new_congTy').value);
        formData.append('diaChiCongTy', document.getElementById('new_diaChiCongTy').value);
        formData.append('loaiSP', document.getElementById('new_loaiSP').value);
        formData.append('ncc', document.getElementById('new_ncc').value);
        formData.append('hinhThuc', document.getElementById('new_hinhThuc').value);
        formData.append('goi', document.getElementById('new_goi').value);
        formData.append('thanhTien', document.getElementById('new_thanhTien').value);
        formData.append('thucThu', document.getElementById('new_thucThu').value);
        formData.append('thucDongNCC', document.getElementById('new_thucDongNCC').value);
        formData.append('thucDongCuoiCung', document.getElementById('new_thucDongCuoiCung').value);

        // Thêm files
        const files = ['fileCmt', 'fileHopDong', 'fileXacNhan', 'fileGpkd', 'fileCccd'];
        files.forEach(fileField => {
          const fileInput = document.getElementById(`new_${fileField}`);
          if (fileInput && fileInput.files.length > 0) {
            formData.append(fileField, fileInput.files[0]);
          }
        });

        // Gửi request tạo đơn hàng
        const response = await fetch('/api/orders', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const result = await response.json();
          alert(`Tạo đơn hàng ${result.maDon} thành công!`);
          window.location.href = '/';
        } else {
          const error = await response.json();
          alert(`Lỗi: ${error.message || 'Không thể tạo đơn hàng'}`);
        }
      } catch (error) {
        console.error('Lỗi gửi form:', error);
        alert('Lỗi khi tạo đơn hàng. Vui lòng thử lại.');
      }
    }

    // Khởi tạo khi trang tải
    document.addEventListener('DOMContentLoaded', initializeAddOrderPage);
  </script>
</body>
</html>
